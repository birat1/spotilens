version: "3.8"

services:
  db:
    image: postgres:16-alpine
    container_name: spotilens_db
    restart: always
    environment:
      POSTGRES_USER: spotilens
      POSTGRES_PASSWORD: password
      POSTGRES_DB: spotilens
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U spotilens -d spotilens"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: spotilens_backend
    restart: always
    environment:
      DATABASE_URL: postgresql+asyncpg://spotilens:password@db:5432/spotilens
      CLIENT_ID: ${CLIENT_ID}
      CLIENT_SECRET: ${CLIENT_SECRET}
      REDIRECT_URI: ${REDIRECT_URI}
      SCOPE: ${SCOPE}
      SESSION_SECRET: ${SESSION_SECRET}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS}
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data: